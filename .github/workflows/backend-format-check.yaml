name: Backend Format Check
on:
  pull_request:
    branches: [main]

jobs:
  format:
    name: Backend Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet format backend/ManageD.slnx --verify-no-changes
